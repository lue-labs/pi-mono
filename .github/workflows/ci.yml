name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests never ran on PRs: fork-safety-check covers lint/typecheck/build only,
  # and release.yml runs a subset after code has already landed. That gap let a
  # provider-transport regression sit on main with three red tests (see #467).
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Build workspace declarations
        run: npm run build

      # test.sh runs the suite in an isolated HOME with every provider credential
      # blanked, so live-API tests skip rather than flake or leak.
      - name: Unit tests
        run: ./test.sh

  fork-safety-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # read published @valkyriweb/* deps (orchestrator) from GitHub Packages
    env:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_OAUTH_TOKEN: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      CEREBRAS_API_KEY: ""
      XAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ZAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      MINIMAX_API_KEY: ""
      MINIMAX_CN_API_KEY: ""
      KIMI_API_KEY: ""
      AI_GATEWAY_API_KEY: ""
      OPENCODE_API_KEY: ""
      COPILOT_GITHUB_TOKEN: ""
      HF_TOKEN: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: ""
      GCLOUD_PROJECT: ""
      GOOGLE_CLOUD_LOCATION: ""
      AWS_PROFILE: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_REGION: ""
      AWS_DEFAULT_REGION: ""
      AWS_BEARER_TOKEN_BEDROCK: ""
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
      AWS_WEB_IDENTITY_TOKEN_FILE: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_BASE_URL: ""
      AZURE_OPENAI_RESOURCE_NAME: ""
      PI_NO_LOCAL_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        # packages/orchestrator depends on the published @valkyriweb/pi-coding-agent
        # (registry, not workspace); authenticate npm to GitHub Packages.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Build workspace declarations
        run: npm run build

      - name: Fork canonical check
        run: npm run check

      # Blocking on error-severity depcruise boundary rules (fork-added files only);
      # warn-severity cycles/orphans and knip findings remain advisory (printed, exit 0).
      - name: Static analysis - fork delta (knip + dependency-cruiser)
        run: npm run lint:fork-delta

      - name: Source CLI smoke
        run: ./pi-test.sh --no-env --version
