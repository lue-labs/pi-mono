name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string
  # Called by release.yml after a Changeset publish so the compiled binaries +
  # GitHub Release ride the same trusted run as the npm publish. The fork cut
  # over to scoped Changeset tags (@valkyriweb/...@x), so the `push: tags: v*`
  # trigger no longer fires on releases — this is the live path.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag/name to create (e.g., v0.79.8)'
        required: true
        type: string
      source_ref:
        description: 'Source ref (commit SHA) to build from'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ inputs.source_ref || inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Prepare GitHub release payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p .release-assets
          # Absolute notes path: the `gh release` calls below run from
          # packages/coding-agent/binaries, so a repo-root-relative path will not
          # resolve. (Previously these read a nonexistent /tmp/release-notes.md.)
          NOTES_FILE="${PWD}/.release-assets/RELEASE_NOTES.md"

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out "${NOTES_FILE}"

          cd packages/coding-agent/binaries

          release_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}"
            gh release upload "${RELEASE_TAG}" "${release_assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --target "${SOURCE_REF}" \
              --notes-file "${NOTES_FILE}" \
              "${release_assets[@]}"
          fi

  # NOTE: the upstream `publish-npm` job (trusted publishing to public
  # registry.npmjs.org) was intentionally removed. This is a PRIVATE fork
  # (valkyriweb/pi-mono); packages publish to GitHub Packages under @valkyriweb
  # via release.yml. Publishing fork code to public npm would leak it.
